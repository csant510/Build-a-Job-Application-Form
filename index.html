<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <form id="job-application">
            <label for="name">Full Nmae: </label>
            <input type="text" id="name" placeholder="Enter Your name" required> 
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label for="position">Position</label>
            <select id="position" required>
                <option value="">Select Position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
            </select>
            <fieldset class="radio-group">
                <legend>Availability</legend>
                <input type="radio" name="availability" value="fulltime" id="fulltime">
                <label for="fulltime" checked> Full Time</label>
                 <input type="radio" name="availability" value="parttime" id="parttime">
                <label for="parttime"> Part Time</label>
            </fieldset>
            <label for="message"></label>
            <textarea id="message" row="5" placeholder="why do you want this job"></textarea>
            <button type="submit">Submit Apllication</button>
        </form>
    </div>
</body>
</html>
